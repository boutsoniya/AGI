<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">100 Days of AGI</title>
<desc id="desc">A research lab poster showing a path from perception to reasoning to action across 100 days.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#17103b"/><stop offset="1" stop-color="#042f3b"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1200" height="520" rx="32" fill="url(#bg)"/>
<circle cx="1020" cy="80" r="150" fill="#8b5cf6" opacity=".18" filter="url(#blur)"/>
<circle cx="180" cy="450" r="170" fill="#22d3ee" opacity=".12" filter="url(#blur)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
<text x="72" y="92" font-size="22" letter-spacing="5" fill="#a5b4fc">PUBLIC RESEARCH / BUILD LOG</text>
<text x="72" y="165" font-size="66" font-weight="800">100 DAYS OF AGI</text>
<text x="76" y="207" font-size="22" fill="#cbd5e1">reasoning · agents · spatial intelligence · memory · world models</text>
<rect x="72" y="252" width="1056" height="2" fill="url(#glow)" opacity=".8"/>
<g font-size="17" fill="#cbd5e1">
<text x="78" y="305">01</text><text x="78" y="333">FOUND</text>
<text x="205" y="305">20</text><text x="205" y="333">REPRESENT</text>
<text x="360" y="305">40</text><text x="360" y="333">PERCEIVE</text>
<text x="510" y="305">60</text><text x="510" y="333">ACT</text>
<text x="650" y="305">80</text><text x="650" y="333">EMBODY</text>
<text x="815" y="305">100</text><text x="815" y="333">INTEGRATE</text>
</g>
<path d="M95 370 C250 330 330 430 470 370 S690 330 820 380 S1010 430 1100 350" fill="none" stroke="url(#glow)" stroke-width="5"/>
<g fill="#fff"><circle cx="95" cy="370" r="8"/><circle cx="470" cy="370" r="8"/><circle cx="820" cy="380" r="8"/><circle cx="1100" cy="350" r="8"/></g>
<text x="72" y="458" font-size="19" fill="#e2e8f0">LEARN → BUILD → BREAK → MEASURE → UNDERSTAND → REPEAT</text>
<text x="72" y="490" font-size="15" fill="#94a3b8">The roadmap can mutate when better technology or better evidence appears.</text>
</g>
</svg>